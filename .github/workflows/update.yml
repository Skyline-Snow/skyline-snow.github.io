# Runs Skyline Snow's learning loop on GitHub's servers and publishes the app with GitHub Pages.
#   every 3 hours: collect.py  (Mt. Bachelor sensors + forecast snapshots)
#   every 3 hours: verify.py   (saves measured SNOTEL snowfall, scores saved forecasts against it)
#   each morning:  stake_photo.py (one snow-stake webcam photo, last 7 days kept on the stake-photos branch)
#   once a day:    calibrate.py (re-learns calibration.json), in the first run of each Pacific day
# New data is committed back to this repository; `git pull` on your Mac brings it down.
name: Update forecast data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:        # "Run workflow" button on GitHub, also runs calibrate
  push:
    branches: [main]
    paths: ["snowline/index.html", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snowline-update
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles   # so "today" and forecast lead times match the Mac and SNOTEL

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect resort sensors and forecast snapshot
        id: collect
        continue-on-error: true
        run: python snowline/learn/collect.py

      - name: Save the morning snow-stake photo (last 7 days kept on the stake-photos branch)
        continue-on-error: true
        run: cd snowline/learn && python stake_photo.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save measured snowfall and score saved forecasts against it
        continue-on-error: true
        run: cd snowline/learn && python verify.py

      # GitHub often starts scheduled runs late, so run whenever today's calibration is missing
      # rather than relying on a particular hour.
      - name: Calibrate (first run each day, or when started by hand)
        run: |
          last=$(python -c "import json;print(json.load(open('snowline/calibration.json'))['generated'][:10])" 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "$(date +%F)" ]; then
            python snowline/learn/calibrate.py
          else
            echo "Not the daily calibration run; skipping."
          fi

      - name: Save new data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snowline/data snowline/calibration.json
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data update $(date +'%Y-%m-%d %H:%M %Z')"
            git pull --rebase
            git push
          fi

      - name: Flag a collection problem
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::collect.py reported a problem (see its step log). If Mt. Bachelor's feed refuses GitHub's servers, keep collecting it on the Mac."

  build-site:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      # Stamp the page with a fingerprint of its code so open copies can tell a newer version is live.
      - name: Stamp app version
        run: |
          v=$(sha256sum snowline/index.html | cut -c1-10)
          sed -i "s/__APP_VERSION__/$v/" snowline/index.html
          printf '{"version":"%s"}\n' "$v" > snowline/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: snowline

  # Separate job so GitHub has registered the uploaded site before deploy looks for it.
  deploy:
    needs: build-site
    if: always() && needs.build-site.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
